[package]
name = "collector"
version = "0.1.0"
edition = "2021"

[dependencies]
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "server-graceful"] }
http-body-util = "0.1" # hyper 1.x has no body collect/limit helpers of its own
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
rdkafka = { version = "0.38", features = ["cmake-build"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
maxminddb = "0.26"
woothee = "0.13"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["io-util"] }
