# Single-host stack. Every deployment value is in .env (see .env.example); values here are internal wiring.
name: pawlog

x-ch-env: &ch-env
  CLICKHOUSE_DB: ${CLICKHOUSE_DB:?}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:?}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}

services:
  redpanda:
    image: redpandadata/redpanda:v25.2.1
    # production mode: the image defaults to developer_mode, which skips fsync
    entrypoint: ["sh", "-c"]
    command:
      - >-
        rpk redpanda mode production >/dev/null &&
        exec rpk redpanda start --check=false --smp=$$SMP --memory=$$MEM --reserve-memory=0M --overprovisioned
        --default-log-level=warn --kafka-addr=0.0.0.0:9092 --advertise-kafka-addr=redpanda:9092
    environment:
      SMP: ${REDPANDA_CPUS:?}
      MEM: ${REDPANDA_MEMORY:?}
    volumes: [redpanda:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits: { cpus: "${REDPANDA_CPUS:?}", memory: "${REDPANDA_MEMORY_LIMIT:?}" }
    restart: unless-stopped

  redpanda-init:
    image: redpandadata/redpanda:v25.2.1
    depends_on: { redpanda: { condition: service_healthy } }
    entrypoint: ["sh", "-c"]
    command:
      - >-
        rpk topic describe "$$T" -X brokers=redpanda:9092 >/dev/null 2>&1 ||
        rpk topic create "$$T" -X brokers=redpanda:9092 -p "$$P" -c retention.ms="$$R"
    environment:
      T: ${KAFKA_TOPIC:?}
      P: ${KAFKA_PARTITIONS:?}
      R: ${KAFKA_RETENTION_MS:?}

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      <<: *ch-env
      CLICKHOUSE_DASHBOARD_PASSWORD: ${CLICKHOUSE_DASHBOARD_PASSWORD:?}
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./clickhouse/config.d/pawlog.xml:/etc/clickhouse-server/config.d/pawlog.xml:ro
      - ./clickhouse/users.d/dashboard.xml:/etc/clickhouse-server/users.d/dashboard.xml:ro
    ports: ["${CLICKHOUSE_HTTP_PUBLISH:?}:8123"]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits: { cpus: "${CLICKHOUSE_CPUS:?}", memory: "${CLICKHOUSE_MEMORY:?}" }
    restart: unless-stopped

  migrate:
    image: clickhouse/clickhouse-server:25.8
    depends_on:
      clickhouse: { condition: service_healthy }
      redpanda-init: { condition: service_completed_successfully }
    entrypoint: ["/pawlog/migrate.sh", "${CLICKHOUSE_DB:?}"]
    environment:
      <<: *ch-env
      CLICKHOUSE_HOST: clickhouse
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:?}
      CLICKHOUSE_KAFKA_GROUP: ${CLICKHOUSE_KAFKA_GROUP:?}
    volumes: [../clickhouse:/pawlog:ro]

  collector:
    build: ../collector
    image: pawlog-collector
    depends_on: { redpanda-init: { condition: service_completed_successfully } }
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:?}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?}
      QUEUE_MAX_MESSAGES: ${QUEUE_MAX_MESSAGES:?}
      PAWLOG_JS_PATH: /srv/pawlog.js
      GEOIP_DB_PATH: ${GEOIP_DB_PATH?}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER?}
      RUST_LOG: ${RUST_LOG:?}
    volumes:
      - ../tracker/dist/pawlog.js:/srv/pawlog.js:ro
      - ./geoip:/geoip:ro
    ports: ["${COLLECTOR_PUBLISH:?}:8080"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits: { cpus: "${COLLECTOR_CPUS:?}", memory: "${COLLECTOR_MEMORY:?}" }
    restart: unless-stopped

  dashboard:
    build: ../dashboard
    image: pawlog-dashboard
    depends_on: { clickhouse: { condition: service_healthy } }
    environment:
      SECRET_KEY_BASE: ${DASHBOARD_SECRET_KEY_BASE:?}
      DASHBOARD_FORCE_SSL: ${DASHBOARD_FORCE_SSL:?}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:?}
      CLICKHOUSE_USER: dashboard
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_DASHBOARD_PASSWORD:?}
      CLICKHOUSE_QUERIES_DIR: /queries
      PAWLOG_SITES_FILE: /config/sites.yml
    volumes:
      - ../clickhouse/queries:/queries:ro
      - ./sites.yml:/config/sites.yml:ro
      - dashboard:/app/storage
    ports: ["${DASHBOARD_PUBLISH:?}:3000"]
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit Net::HTTP.get_response(URI('http://127.0.0.1:3000/up')).code == '200'"]
      interval: 5s
      timeout: 5s
      retries: 60
    restart: unless-stopped

volumes:
  redpanda:
  clickhouse:
  dashboard:
